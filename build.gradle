plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.semnan.unitvoice'
    compileSdk 34

    defaultConfig {
        applicationId "ir.semnan.unitvoice.smart"   // جدا از نسخه‌ی قبلی نصب می‌شود
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// عمداً هیچ کتابخانه‌ی خارجی استفاده نشده است تا ساخت پروژه ساده و کم‌خطا بماند.
dependencies {
}
