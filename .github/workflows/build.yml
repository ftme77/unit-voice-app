name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix folder layout (if the app files were uploaded one level too high)
        run: |
          if [ -d src/main ] && [ -f build.gradle ] && ! grep -q "apply false" build.gradle; then
            echo "Flat layout detected - moving files into app/"
            rm -rf app/src
            mkdir -p app
            mv src app/src
            mv build.gradle app/build.gradle
            printf "plugins {\n    id 'com.android.application' version '8.5.2' apply false\n}\n" > build.gradle
          else
            echo "Layout already correct"
          fi
          echo "--- project files ---"
          find . -path ./.git -prune -o -type f -print | sort | head -80

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unit-voice-apk
          path: app/build/outputs/apk/debug/app-debug.apk
