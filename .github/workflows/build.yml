name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # ۱) اپ قبلی (فقط با سرور) — دقیقاً همان مراحلی که قبلاً درست کار کرد
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix folder layout (if the app files were uploaded one level too high)
        run: |
          if [ -d src/main ] && [ -f build.gradle ] && ! grep -q "apply false" build.gradle; then
            echo "Flat layout detected - moving files into app/"
            rm -rf app/src
            mkdir -p app
            mv src app/src
            mv build.gradle app/build.gradle
            printf "plugins {\n    id 'com.android.application' version '8.5.2' apply false\n}\n" > build.gradle
          else
            echo "Layout already correct"
          fi
          echo "--- project files ---"
          find . -path ./.git -prune -o -type f -print | sort | head -80

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unit-voice-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # ---------------------------------------------------------------------------
  # ۲) اپ‌های جدید با Whisper داخل خود گوشی (کنار اپ قبلی ساخته می‌شوند؛ اگر خطا بدهند اپ قبلی سالم می‌ماند)
  #    فایل local-whisper.zip باید در ریشه‌ی همین مخزن آپلود شده باشد.
  #    دو نسخه ساخته می‌شود:
  #      «محلی» : مدل small  (دقیق‌تر، حدود ۱۹۰ مگابایت، به رم بیشتری نیاز دارد)
  #      «سبک»  : مدل base   (کم‌دقت‌تر ولی خیلی سبک‌تر و سریع‌تر؛ برای گوشی‌های ضعیف‌تر)
  # ---------------------------------------------------------------------------
  build-local:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: small-q5_1
            app_id: ir.semnan.unitvoice.smart.local
            app_label: "آیفون هوشمند (محلی)"
            artifact: unit-voice-apk-local
          - model: base-q5_1
            app_id: ir.semnan.unitvoice.smart.light
            app_label: "آیفون هوشمند (سبک)"
            artifact: unit-voice-apk-light
          # «فارسی»: مدل small که روی داده‌ی فارسی آموزش بیشتر دیده؛ در همین کار به قالب ggml تبدیل می‌شود
          - model: persian-small-q5_1
            hf_repo: steja/whisper-small-persian
            app_id: ir.semnan.unitvoice.smart.fa
            app_label: "آیفون هوشمند (فارسی)"
            artifact: unit-voice-apk-persian
    env:
      # نسخه‌ی whisper.cpp (اولین تگی که پیدا شود استفاده می‌شود)
      WHISPER_CPP_TAGS: "v1.9.1 v1.7.6"
      WHISPER_MODEL: ${{ matrix.model }}
      HF_REPO: ${{ matrix.hf_repo }}
      APP_ID: ${{ matrix.app_id }}
      APP_LABEL: ${{ matrix.app_label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix folder layout (if the app files were uploaded one level too high)
        run: |
          if [ -d src/main ] && [ -f build.gradle ] && ! grep -q "apply false" build.gradle; then
            echo "Flat layout detected - moving files into app/"
            rm -rf app/src
            mkdir -p app
            mv src app/src
            mv build.gradle app/build.gradle
            printf "plugins {\n    id 'com.android.application' version '8.5.2' apply false\n}\n" > build.gradle
          else
            echo "Layout already correct"
          fi

      - name: Add the local-Whisper files (from local-whisper.zip)
        run: |
          set -e
          rm -rf _lw
          # اگر مرورگر اسم فایل را عوض کرده باشد (مثلاً «local-whisper (2).zip») مشکلی نیست:
          # از بین همه‌ی فایل‌های local-whisper*.zip، آن که شماره‌ی نسخه‌ی (versionCode) بالاتری دارد انتخاب می‌شود.
          BEST=""
          BESTV=-1
          for Z in local-whisper*.zip; do
            if [ -f "$Z" ]; then
              V=$(unzip -p "$Z" '*app-build.gradle' 2>/dev/null | grep -oE 'versionCode[[:space:]]+[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
              echo "zip found: '$Z'  versionCode=${V:-unknown}"
              if [ -n "$V" ] && [ "$V" -gt "$BESTV" ]; then
                BEST="$Z"
                BESTV="$V"
              fi
            fi
          done
          if [ -n "$BEST" ]; then
            echo "USING: '$BEST' (versionCode $BESTV)"
            mkdir _lw
            unzip -q "$BEST" -d _lw
            SRC=_lw
          elif [ -d local-whisper ]; then
            SRC=local-whisper
          else
            echo "ERROR: no local-whisper*.zip was found in the repository root."
            echo "Upload local-whisper.zip to the main page of the repository first."
            exit 1
          fi
          GRADLE_FILE=$(find "$SRC" -name app-build.gradle | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: app-build.gradle not found inside local-whisper.zip. Files found:"
            find "$SRC" -type f | head -50
            exit 1
          fi
          L=$(dirname "$GRADLE_FILE")
          M=app/src/main
          cp "$L/app-build.gradle" app/build.gradle
          cp "$L/AndroidManifest.xml" "$M/AndroidManifest.xml"
          # نام و شناسه‌ی اپ را برای هر نسخه (محلی / سبک) تنظیم کن تا هر دو کنار هم نصب شوند
          sed -i "s|applicationId \"[^\"]*\"|applicationId \"${APP_ID}\"|" app/build.gradle
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"${APP_LABEL}\"|" "$M/AndroidManifest.xml"
          grep -n "applicationId" app/build.gradle
          grep -n "android:label" "$M/AndroidManifest.xml"
          mkdir -p "$M/java/ir/semnan/unitvoice" "$M/cpp" "$M/res/layout" "$M/res/drawable"
          cp "$L"/java/*.java "$M/java/ir/semnan/unitvoice/"
          cp "$L"/cpp/* "$M/cpp/"
          cp "$L/res/layout/activity_main.xml" "$M/res/layout/"
          cp "$L"/res/drawable/*.xml "$M/res/drawable/"
          rm -rf _lw
          echo "--- added files ---"
          ls -la "$M/java/ir/semnan/unitvoice" "$M/cpp"

      - name: Get whisper.cpp source
        run: |
          set -e
          cd app/src/main/cpp
          ok=0
          for tag in $WHISPER_CPP_TAGS; do
            rm -rf whisper.cpp
            if git clone --depth 1 --branch "$tag" https://github.com/ggml-org/whisper.cpp.git whisper.cpp; then
              echo "Using whisper.cpp $tag"
              ok=1
              break
            fi
          done
          if [ "$ok" = "0" ]; then
            rm -rf whisper.cpp
            git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git whisper.cpp
            echo "Using whisper.cpp default branch"
          fi
          rm -rf whisper.cpp/.git
          ls whisper.cpp | head -30

      - name: Download the Whisper model
        run: |
          set -e
          mkdir -p app/src/main/assets/models
          if [ -n "${HF_REPO}" ]; then
            # --- مدل فارسی‌آموزش‌دیده: دانلود از Hugging Face و تبدیل به ggml + فشرده‌سازی q5_1 ---
            echo "Converting ${HF_REPO} to ggml"
            python3 -m venv _venv
            . _venv/bin/activate
            pip install --quiet --upgrade pip
            pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet transformers huggingface_hub safetensors numpy
            git clone --depth 1 https://github.com/openai/whisper.git _owhisper
            python - <<'PY'
          import os, shutil
          from huggingface_hub import snapshot_download, hf_hub_download
          repo = os.environ["HF_REPO"]
          snapshot_download(repo_id=repo, local_dir="_hfmodel",
                            allow_patterns=["config.json", "generation_config.json", "model.safetensors", "pytorch_model.bin"])
          # فایل‌های واژگان در همه‌ی مدل‌های Whisper یکی‌اند؛ از مدل اصلی برداشته می‌شود تا به فایل‌های ناقص وابسته نباشیم
          for f in ("vocab.json", "added_tokens.json"):
              shutil.copy(hf_hub_download("openai/whisper-small", f), os.path.join("_hfmodel", f))
          print(sorted(os.listdir("_hfmodel")))
          PY
            mkdir -p _ggml
            python app/src/main/cpp/whisper.cpp/models/convert-h5-to-ggml.py _hfmodel _owhisper _ggml
            ls -la _ggml
            cmake -S app/src/main/cpp/whisper.cpp -B _qb -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
            cmake --build _qb --target whisper-quantize -j4
            ./_qb/bin/whisper-quantize _ggml/ggml-model.bin app/src/main/assets/models/whisper-model.bin q5_1
            deactivate
          else
            URL="https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-${WHISPER_MODEL}.bin"
            echo "Downloading $URL"
            curl -L --fail --retry 5 --retry-delay 10 -o app/src/main/assets/models/whisper-model.bin "$URL"
          fi
          ls -la app/src/main/assets/models
          SIZE=$(stat -c %s app/src/main/assets/models/whisper-model.bin)
          MAGIC=$(head -c 4 app/src/main/assets/models/whisper-model.bin | od -An -tx1 | tr -d ' \n')
          echo "size=$SIZE magic=$MAGIC"
          if [ "$SIZE" -lt 20000000 ] || [ "$MAGIC" != "6c6d6767" ]; then
            echo "ERROR: the downloaded file does not look like a ggml Whisper model."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Pick NDK and CMake versions
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK: $SDK"
          ls "$SDK/ndk" 2>/dev/null || echo "(no NDK folder)"
          ls "$SDK/cmake" 2>/dev/null || echo "(no cmake folder)"
          ALL_NDK=$(ls "$SDK/ndk" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)
          # ترجیح: جدیدترین نسخه‌ی ۲۷ یا قدیمی‌تر (آزمودهٔ بیشتر)، وگرنه جدیدترین موجود
          NDK=$(echo "$ALL_NDK" | grep -E '^([0-9]|1[0-9]|2[0-7])\.' | tail -1 || true)
          if [ -z "$NDK" ]; then
            NDK=$(echo "$ALL_NDK" | tail -1 || true)
          fi
          if [ -z "$NDK" ]; then
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "ndk;26.3.11579264"
            NDK=26.3.11579264
          fi
          if [ -d "$SDK/cmake/3.22.1" ]; then
            CM=3.22.1
          else
            CM=$(ls "$SDK/cmake" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          fi
          if [ -z "$CM" ]; then
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "cmake;3.22.1"
            CM=3.22.1
          fi
          echo "NDK_VERSION=$NDK" >> "$GITHUB_ENV"
          echo "CMAKE_VERSION=$CM" >> "$GITHUB_ENV"
          echo "Using NDK $NDK and CMake $CM"

      - name: Build debug APK (with local Whisper, ${{ matrix.model }})
        run: gradle assembleDebug --no-daemon -PndkVersion="$NDK_VERSION" -PcmakeVersion="$CMAKE_VERSION"

      - name: APK size
        run: ls -la app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
